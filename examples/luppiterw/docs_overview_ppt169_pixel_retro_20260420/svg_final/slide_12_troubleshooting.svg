<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="softShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="4" result="offsetBlur" />
      <feFlood flood-color="#0F172A" flood-opacity="0.10" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge><feMergeNode in="shadow" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#0D1117" />
  <rect x="0" y="0" width="1280" height="4" fill="#39FF14" fill-opacity="0.65" /><rect x="0" y="6" width="640" height="2" fill="#00D4FF" fill-opacity="0.45" /><rect x="0" y="714" width="1280" height="2" fill="#00D4FF" fill-opacity="0.45" /><rect x="0" y="716" width="1280" height="4" fill="#39FF14" fill-opacity="0.65" /><text fill="#39FF14" font-family="&quot;Consolas&quot;, &quot;Monaco&quot;, &quot;Courier New&quot;, monospace" font-weight="700" font-size="34" x="60" y="86">Most setup failures are environment issues,</text><text fill="#39FF14" font-family="&quot;Consolas&quot;, &quot;Monaco&quot;, &quot;Courier New&quot;, monospace" font-weight="700" font-size="34" x="60" y="122">not product logic issues</text><text x="60" y="116" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#8B949E">The troubleshooting section is mostly about PATH, pip targeting, missing modules, and script permissions.</text>

  <g id="chevrons" filter="url(#softShadow)">
    <polygon points="60,222 254,222 288,266 254,310 60,310" fill="#39FF14" />
    <text x="164" y="261" text-anchor="middle" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Check PATH</text>
    <text x="164" y="283" text-anchor="middle" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#FFFFFF">where python</text>

    <polygon points="300,222 494,222 528,266 494,310 300,310 334,266" fill="#00D4FF" />
    <text x="414" y="261" text-anchor="middle" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Match pip to Python</text>
    <text x="414" y="283" text-anchor="middle" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#FFFFFF">python -m pip</text>

    <polygon points="540,222 734,222 768,266 734,310 540,310 574,266" fill="#FF2E97" />
    <text x="654" y="261" text-anchor="middle" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Test imports</text>
    <text x="654" y="283" text-anchor="middle" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#FFFFFF">pptx + fitz</text>

    <polygon points="780,222 974,222 1008,266 974,310 780,310 814,266" fill="#39FF14" />
    <text x="894" y="261" text-anchor="middle" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Run small sample</text>
    <text x="894" y="283" text-anchor="middle" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#FFFFFF">prove the chain</text>

    <polygon points="1020,222 1180,222 1214,266 1180,310 1020,310 1054,266" fill="#FFD700" />
    <text x="1118" y="261" text-anchor="middle" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Escalate edge cases</text>
    <text x="1118" y="283" text-anchor="middle" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#FFFFFF">CairoSVG / Node / Pandoc</text>
  </g>

  <g id="bottomCards">
    <g id="card1" filter="url(#softShadow)">
      <path fill="#161B22" stroke="#30363D" stroke-width="2" d="M66,378 H428 A6,6 0 0 1 434,384 V596 A6,6 0 0 1 428,602 H66 A6,6 0 0 1 60,596 V384 A6,6 0 0 1 66,378 Z" />
      <text x="92" y="420" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">Common failure modes</text>
      <text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" x="92" y="466">- `python` opens the Microsoft Store</text><text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" x="92" y="490">- `pip` installs to the wrong interpreter</text><text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" x="92" y="514">- PowerShell blocks script execution</text><text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" x="92" y="538">- PyMuPDF import is missing or broken</text></g>

    <g id="card2" filter="url(#softShadow)">
      <path fill="#161B22" stroke="#30363D" stroke-width="2" d="M460,378 H822 A6,6 0 0 1 828,384 V596 A6,6 0 0 1 822,602 H460 A6,6 0 0 1 454,596 V384 A6,6 0 0 1 460,378 Z" />
      <text x="486" y="420" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">What to try first</text>
      <text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" x="486" y="466">1  Re-check PATH</text><text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" x="486" y="490">2  Use `python -m pip`</text><text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" x="486" y="514">3  Re-run the core import test</text><text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" x="486" y="538">4  Restart the terminal before retrying</text></g>

    <g id="card3" filter="url(#softShadow)">
      <path fill="#161B22" stroke="#30363D" stroke-width="2" d="M854,378 H1214 A6,6 0 0 1 1220,384 V596 A6,6 0 0 1 1214,602 H854 A6,6 0 0 1 848,596 V384 A6,6 0 0 1 854,378 Z" />
      <text x="880" y="420" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">Mindset</text>
      <text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" x="880" y="466">Do not start debugging slide design until the</text><text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" x="880" y="490">runtime, imports, and minimal sample path all</text><text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" x="880" y="514">work cleanly on the machine.</text></g>
  </g>

  <text x="1208" y="684" text-anchor="end" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#8B949E">12</text>
</svg>