<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="softShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" />
      <feOffset dx="0" dy="4" result="offsetBlur" />
      <feFlood flood-color="#0F172A" flood-opacity="0.10" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge><feMergeNode in="shadow" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF" />
  <rect x="0" y="0" width="1280" height="4" fill="#005587" /><text x="60" y="86" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="34" font-weight="700" fill="#2C3E50">Four approaches, four different trade-offs</text>
  <text x="60" y="116" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="16" fill="#5D6D7E">The product story is built on rejecting three unsatisfying paths.</text>

  <g id="col1" filter="url(#softShadow)">
    <rect x="60" y="160" width="270" height="472" rx="24" fill="#ECF0F1" />
    <rect x="60" y="160" width="270" height="12" rx="6" fill="#E74C3C" />
    <text x="88" y="214" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="22" font-weight="700" fill="#2C3E50">Embed images</text>
    <text x="88" y="248" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="16" fill="#E74C3C">Looks polished, loses editability</text>
    <text x="88" y="312" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="15" fill="#5D6D7E">
      <tspan x="88" dy="0">- Everything becomes a flat visual</tspan>
      <tspan x="88" dy="25">- Text cannot be selected</tspan>
      <tspan x="88" dy="25">- Scaling behaves like a screenshot</tspan>
    </text>
  </g>

  <g id="col2" filter="url(#softShadow)">
    <rect x="350" y="160" width="270" height="472" rx="24" fill="#ECF0F1" />
    <rect x="350" y="160" width="270" height="12" rx="6" fill="#E74C3C" />
    <text x="378" y="214" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="22" font-weight="700" fill="#2C3E50">HTML/CSS export</text>
    <text x="378" y="248" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="16" fill="#E74C3C">Strong on the web, weak in PPT</text>
    <text x="378" y="312" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="15" fill="#5D6D7E">
      <tspan x="378" dy="0">- Browser flow is not slide geometry</tspan>
      <tspan x="378" dy="25">- Layouts break on export</tspan>
      <tspan x="378" dy="25">- Elements often get flattened</tspan>
    </text>
  </g>

  <g id="col3" filter="url(#softShadow)">
    <rect x="640" y="160" width="270" height="472" rx="24" fill="#ECF0F1" />
    <rect x="640" y="160" width="270" height="12" rx="6" fill="#E74C3C" />
    <text x="668" y="214" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="22" font-weight="700" fill="#2C3E50">Direct python-pptx</text>
    <text x="668" y="248" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="16" fill="#E74C3C">Editable objects, weak visuals</text>
    <text x="668" y="312" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="15" fill="#5D6D7E">
      <tspan x="668" dy="0">- AI has less design-native training data</tspan>
      <tspan x="668" dy="25">- Results skew toward boxes and bullets</tspan>
      <tspan x="668" dy="25">- Complex design systems are hard to express</tspan>
    </text>
  </g>

  <g id="col4" filter="url(#softShadow)">
    <rect x="930" y="160" width="290" height="472" rx="24" fill="#ECF0F1" />
    <rect x="930" y="160" width="290" height="12" rx="6" fill="#005587" />
    <use data-icon="chunk/chart-bar" x="958" y="193" width="32" height="32" fill="#005587" />
    <text x="1008" y="214" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="22" font-weight="700" fill="#2C3E50">PPT Master path</text>
    <text x="958" y="248" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="16" fill="#005587">SVG -&gt; post-process -&gt; DrawingML</text>
    <text x="958" y="312" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="15" fill="#5D6D7E">
      <tspan x="958" dy="0">- Keeps the vector/canvas mindset intact</tspan>
      <tspan x="958" dy="25">- Preserves editable native slide objects</tspan>
      <tspan x="958" dy="25">- Makes the engineering transformation explicit</tspan>
    </text>
    <rect x="958" y="510" width="234" height="74" rx="18" fill="#ECF0F1" />
    <text x="986" y="540" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="16" font-weight="700" fill="#2C3E50">Positioning summary</text>
    <text x="986" y="566" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="14" fill="#5D6D7E">A bridge between design quality and object-level editability.</text>
  </g>

  <text x="1208" y="684" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="12" fill="#7F8C8D">03</text>
</svg>