<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="softShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#0F172A" flood-opacity="0.10" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#F7F9FC"/>
  <text x="60" y="86" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#1F2937">SVG is the practical bridge format</text>
  <text x="60" y="116" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="16" fill="#5B6472">The technical design doc explains the choice by elimination, not by trend.</text>

  <g id="table" filter="url(#softShadow)">
    <rect x="60" y="160" width="1160" height="474" rx="24" fill="#FFFFFF"/>
    <rect x="60" y="160" width="1160" height="74" rx="24" fill="#EAF0F8"/>
    <text x="108" y="205" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#5B6472">Approach</text>
    <text x="426" y="205" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#5B6472">Why it falls short</text>
    <text x="930" y="205" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1565C0">Why SVG wins here</text>

    <line x1="360" y1="160" x2="360" y2="634" stroke="#D6DEEA" stroke-width="2"/>
    <line x1="850" y1="160" x2="850" y2="634" stroke="#D6DEEA" stroke-width="2"/>
    <line x1="60" y1="252" x2="1220" y2="252" stroke="#D6DEEA" stroke-width="2"/>
    <line x1="60" y1="348" x2="1220" y2="348" stroke="#D6DEEA" stroke-width="2"/>
    <line x1="60" y1="444" x2="1220" y2="444" stroke="#D6DEEA" stroke-width="2"/>
    <line x1="60" y1="540" x2="1220" y2="540" stroke="#D6DEEA" stroke-width="2"/>

    <text x="108" y="308" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1F2937">Direct DrawingML</text>
    <text x="390" y="288" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="15" fill="#5B6472">
      <tspan x="390" dy="0">Too verbose for robust AI authoring.</tspan>
      <tspan x="390" dy="22">Hard to debug by eye.</tspan>
    </text>
    <text x="882" y="308" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="15" fill="#1565C0">SVG keeps the vector logic readable before export.</text>

    <text x="108" y="404" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1F2937">HTML/CSS</text>
    <text x="390" y="384" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="15" fill="#5B6472">
      <tspan x="390" dy="0">Great for document flow and browsers,</tspan>
      <tspan x="390" dy="22">weak for independent slide objects.</tspan>
    </text>
    <text x="882" y="404" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="15" fill="#1565C0">SVG matches the slide canvas worldview.</text>

    <text x="108" y="500" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1F2937">WMF / EMF</text>
    <text x="390" y="480" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="15" fill="#5B6472">
      <tspan x="390" dy="0">Closer to Microsoft graphics internally,</tspan>
      <tspan x="390" dy="22">but nearly useless as an AI authoring target.</tspan>
    </text>
    <text x="882" y="500" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="15" fill="#1565C0">SVG has far better model familiarity and visual inspectability.</text>

    <text x="108" y="596" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1F2937">SVG as image only</text>
    <text x="390" y="576" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="15" fill="#5B6472">
      <tspan x="390" dy="0">Easy export path, but editability disappears.</tspan>
      <tspan x="390" dy="22">Everything becomes a static visual.</tspan>
    </text>
    <text x="882" y="596" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="15" fill="#1565C0">PPT Master uses SVG as an intermediate engineering artifact, not as the final image.</text>
  </g>

  <text x="1208" y="684" text-anchor="end" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="12" fill="#8B95A7">07</text>
</svg>
