<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#00ACC1"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#0F172A" flood-opacity="0.10" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>
  <rect x="58" y="42" width="1164" height="2" fill="#D6DEEA"/>
  <text x="60" y="92" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="url(#titleGrad)">A real PowerPoint workflow, not a screenshot export</text>
  <text x="60" y="122" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="16" fill="#5B6472">The core message across the docs is simple: the output must stay editable.</text>

  <g id="claimCard" filter="url(#softShadow)">
    <rect x="60" y="164" width="476" height="472" rx="28" fill="#FFFFFF"/>
    <rect x="60" y="164" width="476" height="472" rx="28" fill="#1565C0" fill-opacity="0.03"/>
    <use data-icon="chunk/layers" x="98" y="204" width="44" height="44" fill="#1565C0"/>
    <text x="162" y="235" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#1F2937">Core differentiator</text>
    <text x="98" y="306" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#1F2937">
      <tspan x="98" dy="0">If it cannot be opened and</tspan>
      <tspan x="98" dy="42">edited like a real deck,</tspan>
      <tspan x="98" dy="42">it should not be called a PPT.</tspan>
    </text>
    <rect x="98" y="458" width="396" height="118" rx="18" fill="#EAF0F8"/>
    <text x="126" y="496" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1565C0">Implication</text>
    <text x="126" y="526" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="15" fill="#5B6472">
      <tspan x="126" dy="0">The system is optimized around native shapes, text boxes,</tspan>
      <tspan x="126" dy="24">and engineering conversion, not just eye-catching screenshots.</tspan>
    </text>
  </g>

  <g id="rightList">
    <g id="item1" filter="url(#softShadow)">
      <rect x="574" y="180" width="648" height="118" rx="22" fill="#FFFFFF"/>
      <use data-icon="chunk/chart-bar" x="608" y="214" width="34" height="34" fill="#1565C0"/>
      <text x="660" y="235" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1F2937">The deck is treated as a working file</text>
      <text x="660" y="266" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="16" fill="#5B6472">
        <tspan x="660" dy="0">The docs repeatedly frame the export as a usable artifact, not a frozen visual.</tspan>
      </text>
    </g>

    <g id="item2" filter="url(#softShadow)">
      <rect x="574" y="324" width="648" height="118" rx="22" fill="#FFFFFF"/>
      <use data-icon="chunk/code" x="608" y="358" width="34" height="34" fill="#00ACC1"/>
      <text x="660" y="379" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1F2937">The engineering path is explicit</text>
      <text x="660" y="410" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="16" fill="#5B6472">
        <tspan x="660" dy="0">SVG generation, post-processing, and DrawingML export are all first-class steps.</tspan>
      </text>
    </g>

    <g id="item3" filter="url(#softShadow)">
      <rect x="574" y="468" width="648" height="118" rx="22" fill="#FFFFFF"/>
      <use data-icon="chunk/user" x="608" y="502" width="34" height="34" fill="#7C4DFF"/>
      <text x="660" y="523" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1F2937">The user keeps final control</text>
      <text x="660" y="554" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="16" fill="#5B6472">
        <tspan x="660" dy="0">The AI does the heavy lifting, but the final mile still belongs to the presenter.</tspan>
      </text>
    </g>
  </g>

  <text x="1208" y="684" text-anchor="end" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="12" fill="#8B95A7">02</text>
</svg>
