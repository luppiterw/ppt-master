<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="softShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="4" result="offsetBlur" />
      <feFlood flood-color="#0F172A" flood-opacity="0.10" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge><feMergeNode in="shadow" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005587" />
      <stop offset="100%" stop-color="#F5A623" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF" />
  <rect x="0" y="0" width="1280" height="4" fill="#005587" /><text x="60" y="86" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="34" font-weight="700" fill="#005587">Choose PPT Master when editability matters more than instant browser output</text>
  <text x="60" y="116" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="16" fill="#5D6D7E">The docs close with a clear boundary: this is a serious workflow for serious slide users.</text>

  <g id="pros" filter="url(#softShadow)">
    <path fill="#ECF0F1" d="M88,170 H582 A28,28 0 0 1 610,198 V568 A28,28 0 0 1 582,596 H88 A28,28 0 0 1 60,568 V198 A28,28 0 0 1 88,170 Z" />
    <path fill="#27AE60" d="M88,170 H582 A28,28 0 0 1 610,198 V212 A28,28 0 0 1 582,240 H88 A28,28 0 0 1 60,212 V198 A28,28 0 0 1 88,170 Z" />
    <text x="335" y="214" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Best fit</text>
    <text x="102" y="288" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="18" font-weight="700" fill="#2C3E50">Use it when you want:</text>
    <text font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#5D6D7E" font-size="16" x="102" y="336">- Native editable output for real delivery work</text><text font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#5D6D7E" font-size="16" x="102" y="364">- Transparent cost without platform subscription lock-in</text><text font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#5D6D7E" font-size="16" x="102" y="392">- Local handling of source materials and exports</text><text font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#5D6D7E" font-size="16" x="102" y="420">- Freedom to pair the workflow with your preferred AI IDE</text></g>

  <g id="cons" filter="url(#softShadow)">
    <path fill="#ECF0F1" d="M698,170 H1192 A28,28 0 0 1 1220,198 V568 A28,28 0 0 1 1192,596 H698 A28,28 0 0 1 670,568 V198 A28,28 0 0 1 698,170 Z" />
    <path fill="#E74C3C" d="M698,170 H1192 A28,28 0 0 1 1220,198 V212 A28,28 0 0 1 1192,240 H698 A28,28 0 0 1 670,212 V198 A28,28 0 0 1 698,170 Z" />
    <text x="945" y="214" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Not the right fit</text>
    <text x="712" y="288" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="18" font-weight="700" fill="#2C3E50">Skip it if you need:</text>
    <text font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#5D6D7E" font-size="16" x="712" y="336">- Zero-setup instant slides in a browser UI</text><text font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#5D6D7E" font-size="16" x="712" y="364">- Real-time collaboration and share-link workflows</text><text font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#5D6D7E" font-size="16" x="712" y="392">- Spreadsheet-bound native chart objects</text><text font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#5D6D7E" font-size="16" x="712" y="420">- A fully polished final deck with no human review</text></g>

  <g id="footerStatement">
    <text x="60" y="658" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="20" font-weight="700" fill="#2C3E50">PPT Master is not the easiest path. It is the path optimized for editable, controllable output.</text>
  </g>

  <text x="1208" y="684" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="12" fill="#7F8C8D">13</text>
</svg>