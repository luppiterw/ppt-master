<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="softShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" />
      <feOffset dx="0" dy="4" result="offsetBlur" />
      <feFlood flood-color="#0F172A" flood-opacity="0.10" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge><feMergeNode in="shadow" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF" />
  <rect x="0" y="0" width="1280" height="4" fill="#005587" /><text x="60" y="86" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="34" font-weight="700" fill="#2C3E50">The workflow is a serial design-to-engineering pipeline</text>
  <text x="60" y="116" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="16" fill="#5D6D7E">The docs are explicit that every stage feeds the next and should not be parallelized blindly.</text>

  <g id="flowLine">
    <path fill="#D8E0E5" d="M114,300 H1166 A4,4 0 0 1 1170,304 V304 A4,4 0 0 1 1166,308 H114 A4,4 0 0 1 110,304 V304 A4,4 0 0 1 114,300 Z" />
    <polygon points="330,304 314,292 314,316" fill="#B5C1D4" />
    <polygon points="560,304 544,292 544,316" fill="#B5C1D4" />
    <polygon points="790,304 774,292 774,316" fill="#B5C1D4" />
    <polygon points="1020,304 1004,292 1004,316" fill="#B5C1D4" />
  </g>

  <g id="node1" filter="url(#softShadow)">
    <circle cx="170" cy="304" r="42" fill="#005587" />
    <text x="170" y="296" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">SOURCE</text>
    <text x="170" y="314" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">INPUT</text>
  </g>
  <g id="box1" filter="url(#softShadow)">
    <path fill="#ECF0F1" d="M82,394 H258 A22,22 0 0 1 280,416 V560 A22,22 0 0 1 258,582 H82 A22,22 0 0 1 60,560 V416 A22,22 0 0 1 82,394 Z" />
    <text x="88" y="432" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="20" font-weight="700" fill="#2C3E50">Normalize content</text>
    <text font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#5D6D7E" font-size="15" x="88" y="468">PDF, DOCX, URL, and Markdown</text><text font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#5D6D7E" font-size="15" x="88" y="490">are converted into structured text.</text></g>

  <g id="node2" filter="url(#softShadow)">
    <circle cx="400" cy="304" r="42" fill="#0076A8" />
    <text x="400" y="300" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">STRAT</text>
    <text x="400" y="316" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">EGIST</text>
  </g>
  <g id="box2" filter="url(#softShadow)">
    <path fill="#ECF0F1" d="M312,394 H488 A22,22 0 0 1 510,416 V560 A22,22 0 0 1 488,582 H312 A22,22 0 0 1 290,560 V416 A22,22 0 0 1 312,394 Z" />
    <text x="318" y="432" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="20" font-weight="700" fill="#2C3E50">Plan the deck</text>
    <text font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#5D6D7E" font-size="15" x="318" y="468">The strategist defines page count,</text><text font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#5D6D7E" font-size="15" x="318" y="490">visual system, and content outline.</text></g>

  <g id="node3" filter="url(#softShadow)">
    <circle cx="630" cy="304" r="42" fill="#F5A623" />
    <text x="630" y="300" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">EXEC</text>
    <text x="630" y="316" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">UTOR</text>
  </g>
  <g id="box3" filter="url(#softShadow)">
    <path fill="#ECF0F1" d="M542,394 H718 A22,22 0 0 1 740,416 V560 A22,22 0 0 1 718,582 H542 A22,22 0 0 1 520,560 V416 A22,22 0 0 1 542,394 Z" />
    <text x="548" y="432" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="20" font-weight="700" fill="#2C3E50">Generate SVG pages</text>
    <text font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#5D6D7E" font-size="15" x="548" y="468">The main agent produces slide SVGs</text><text font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#5D6D7E" font-size="15" x="548" y="490">and complete speaker notes.</text></g>

  <g id="node4" filter="url(#softShadow)">
    <circle cx="860" cy="304" r="42" fill="#27AE60" />
    <text x="860" y="300" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">FINAL</text>
    <text x="860" y="316" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">IZE</text>
  </g>
  <g id="box4" filter="url(#softShadow)">
    <path fill="#ECF0F1" d="M772,394 H948 A22,22 0 0 1 970,416 V560 A22,22 0 0 1 948,582 H772 A22,22 0 0 1 750,560 V416 A22,22 0 0 1 772,394 Z" />
    <text x="778" y="432" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="20" font-weight="700" fill="#2C3E50">Post-process assets</text>
    <text font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#5D6D7E" font-size="15" x="778" y="468">Icons, images, text flattening,</text><text font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#5D6D7E" font-size="15" x="778" y="490">and PowerPoint-safe cleanup happen here.</text></g>

  <g id="node5" filter="url(#softShadow)">
    <circle cx="1090" cy="304" r="42" fill="#E74C3C" />
    <text x="1090" y="300" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">PPTX</text>
    <text x="1090" y="316" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">OUT</text>
  </g>
  <g id="box5" filter="url(#softShadow)">
    <path fill="#ECF0F1" d="M1002,394 H1198 A22,22 0 0 1 1220,416 V560 A22,22 0 0 1 1198,582 H1002 A22,22 0 0 1 980,560 V416 A22,22 0 0 1 1002,394 Z" />
    <text x="1008" y="432" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="20" font-weight="700" fill="#2C3E50">Export editable deck</text>
    <text font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#5D6D7E" font-size="15" x="1008" y="468">The converter emits a native shapes</text><text font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" fill="#5D6D7E" font-size="15" x="1008" y="490">deck plus an SVG reference backup.</text></g>

  <text x="1208" y="684" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="12" fill="#7F8C8D">05</text>
</svg>