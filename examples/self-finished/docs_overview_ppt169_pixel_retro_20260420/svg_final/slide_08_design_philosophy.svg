<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="softShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="4" result="offsetBlur" />
      <feFlood flood-color="#0F172A" flood-opacity="0.10" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge><feMergeNode in="shadow" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#0D1117" />
  <rect x="0" y="0" width="1280" height="4" fill="#39FF14" fill-opacity="0.65" /><rect x="0" y="6" width="640" height="2" fill="#00D4FF" fill-opacity="0.45" /><rect x="0" y="714" width="1280" height="2" fill="#00D4FF" fill-opacity="0.45" /><rect x="0" y="716" width="1280" height="4" fill="#39FF14" fill-opacity="0.65" /><text x="60" y="86" font-family="&quot;Consolas&quot;, &quot;Monaco&quot;, &quot;Courier New&quot;, monospace" font-size="34" font-weight="700" fill="#39FF14">AI is the designer, not the finisher</text>
  <text x="60" y="116" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#8B949E">The docs are unusually direct: this is a draft generator for professionals, not a magic finalizer.</text>

  <g id="leftPanel" filter="url(#softShadow)">
    <path fill="#39FF14" d="M88,166 H516 A28,28 0 0 1 544,194 V606 A28,28 0 0 1 516,634 H88 A28,28 0 0 1 60,606 V194 A28,28 0 0 1 88,166 Z" />
    <text fill="#FFFFFF" font-family="&quot;Consolas&quot;, &quot;Monaco&quot;, &quot;Courier New&quot;, monospace" font-weight="700" font-size="40" x="100" y="262">The goal is to remove</text><text fill="#FFFFFF" font-family="&quot;Consolas&quot;, &quot;Monaco&quot;, &quot;Courier New&quot;, monospace" font-weight="700" font-size="40" x="100" y="314">most of the blank-page work,</text><text fill="#FFFFFF" font-family="&quot;Consolas&quot;, &quot;Monaco&quot;, &quot;Courier New&quot;, monospace" font-weight="700" font-size="40" x="100" y="366">not to replace judgment.</text><text fill="#FFFFFF" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" fill-opacity="0.88" font-size="18" x="100" y="472">Think of it as an architect's rendering:</text><text fill="#FFFFFF" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" fill-opacity="0.88" font-size="18" x="100" y="498">strong direction, clear structure,</text><text fill="#FFFFFF" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" fill-opacity="0.88" font-size="18" x="100" y="524">but still open to human finishing work.</text></g>

  <g id="rightTop" filter="url(#softShadow)">
    <path fill="#161B22" stroke="#30363D" stroke-width="2" d="M590,166 H1214 A6,6 0 0 1 1220,172 V374 A6,6 0 0 1 1214,380 H590 A6,6 0 0 1 584,374 V172 A6,6 0 0 1 590,166 Z" />
    <text x="618" y="208" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">What the workflow expects from the user</text>
    <text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" x="618" y="252">- Review visual output slide by slide when quality matters</text><text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" x="618" y="278">- Regenerate or manually adjust pages with layout defects</text><text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" x="618" y="304">- Use taste and context to finish the last mile in PowerPoint</text></g>

  <g id="rightBottom" filter="url(#softShadow)">
    <path fill="#161B22" stroke="#30363D" stroke-width="2" d="M590,404 H1214 A6,6 0 0 1 1220,410 V628 A6,6 0 0 1 1214,634 H590 A6,6 0 0 1 584,628 V410 A6,6 0 0 1 590,404 Z" />
    <text x="618" y="446" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">What the workflow admits openly</text>
    <text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" x="618" y="490">- Setup is heavier than browser-based SaaS tools</text><text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" x="618" y="516">- Serial generation is slower, but is used to preserve consistency</text><text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" x="618" y="542">- Charts look strong, but are not spreadsheet-bound native chart objects</text><text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" x="618" y="568">- Collaboration and drag-and-drop UI are not the product's strength</text></g>

  <text x="1208" y="684" text-anchor="end" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#8B949E">08</text>
</svg>