    <text x="88" y="432" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" font-weight="700" fill="#E6EDF3">Normalize content</text>
    <text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" x="88" y="468">PDF, DOCX, URL, and Markdown</text><text fill="#8B949E" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" x="88" y="490">are converted into structured text.</text></g>

