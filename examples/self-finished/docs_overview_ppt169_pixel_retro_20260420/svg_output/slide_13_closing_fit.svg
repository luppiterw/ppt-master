<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="softShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="4" result="offsetBlur" />
      <feFlood flood-color="#0F172A" flood-opacity="0.10" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge><feMergeNode in="shadow" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39FF14" />
      <stop offset="100%" stop-color="#FF2E97" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#0D1117" />
  <rect x="0" y="0" width="1280" height="4" fill="#39FF14" fill-opacity="0.65" /><rect x="0" y="6" width="640" height="2" fill="#00D4FF" fill-opacity="0.45" /><rect x="0" y="714" width="1280" height="2" fill="#00D4FF" fill-opacity="0.45" /><rect x="0" y="716" width="1280" height="4" fill="#39FF14" fill-opacity="0.65" /><text x="60" y="86" font-family="&quot;Consolas&quot;, &quot;Monaco&quot;, &quot;Courier New&quot;, monospace" font-size="34" font-weight="700" fill="#39FF14">Choose PPT Master when editability matters more than instant browser output</text>
  <text x="60" y="116" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#8B949E">The docs close with a clear boundary: this is a serious workflow for serious slide users.</text>

  <g id="pros" filter="url(#softShadow)">
    <rect x="60" y="170" width="550" height="426" rx="6" fill="#161B22" stroke="#30363D" stroke-width="2" />
    <rect x="60" y="170" width="550" height="70" rx="28" fill="#39FF14" />
    <text x="335" y="214" text-anchor="middle" font-family="&quot;Consolas&quot;, &quot;Monaco&quot;, &quot;Courier New&quot;, monospace" font-size="24" font-weight="700" fill="#FFFFFF">Best fit</text>
    <text x="102" y="288" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="700" fill="#E6EDF3">Use it when you want:</text>
    <text x="102" y="336" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#8B949E">
      <tspan x="102" dy="0">- Native editable output for real delivery work</tspan>
      <tspan x="102" dy="28">- Transparent cost without platform subscription lock-in</tspan>
      <tspan x="102" dy="28">- Local handling of source materials and exports</tspan>
      <tspan x="102" dy="28">- Freedom to pair the workflow with your preferred AI IDE</tspan>
    </text>
  </g>

  <g id="cons" filter="url(#softShadow)">
    <rect x="670" y="170" width="550" height="426" rx="6" fill="#161B22" stroke="#30363D" stroke-width="2" />
    <rect x="670" y="170" width="550" height="70" rx="28" fill="#FFD700" />
    <text x="945" y="214" text-anchor="middle" font-family="&quot;Consolas&quot;, &quot;Monaco&quot;, &quot;Courier New&quot;, monospace" font-size="24" font-weight="700" fill="#FFFFFF">Not the right fit</text>
    <text x="712" y="288" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="700" fill="#E6EDF3">Skip it if you need:</text>
    <text x="712" y="336" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#8B949E">
      <tspan x="712" dy="0">- Zero-setup instant slides in a browser UI</tspan>
      <tspan x="712" dy="28">- Real-time collaboration and share-link workflows</tspan>
      <tspan x="712" dy="28">- Spreadsheet-bound native chart objects</tspan>
      <tspan x="712" dy="28">- A fully polished final deck with no human review</tspan>
    </text>
  </g>

  <g id="footerStatement">
    <text x="60" y="658" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" font-weight="700" fill="#E6EDF3">PPT Master is not the easiest path. It is the path optimized for editable, controllable output.</text>
  </g>

  <text x="1208" y="684" text-anchor="end" font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#8B949E">13</text>
</svg>