<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="softShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="4" result="offsetBlur" />
      <feFlood flood-color="#0F172A" flood-opacity="0.10" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge><feMergeNode in="shadow" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF" />
  <rect x="0" y="0" width="1280" height="6" fill="#D97757" /><text x="60" y="52" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#D97757">QUALITY BAR</text><text x="60" y="86" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="34" font-weight="700" fill="#1A1A2E">Output quality depends on the model and the review loop</text>
  <text x="60" y="116" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="16" fill="#64748B">The FAQ is candid: when layout breaks, the problem is usually model capability, not the whole pipeline.</text>

  <g id="leftPanel" filter="url(#softShadow)">
    <rect x="60" y="166" width="520" height="468" rx="26" fill="#F8FAFC" />
    <text x="96" y="214" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="22" font-weight="700" fill="#1A1A2E">Recommended quality stance</text>
    <text x="96" y="266" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="16" fill="#64748B">
      <tspan x="96" dy="0">- Claude is positioned as the strongest layout model in the project docs</tspan>
      <tspan x="96" dy="26">- Other models can work, but with lower confidence on spacing and coordinates</tspan>
      <tspan x="96" dy="26">- High-quality output assumes page review and selective regeneration</tspan>
      <tspan x="96" dy="26">- The deck is described as a high-quality starting point, not a guaranteed final deliverable</tspan>
    </text>
  </g>

  <g id="rightFlow" filter="url(#softShadow)">
    <rect x="620" y="166" width="600" height="468" rx="26" fill="#F8FAFC" />
    <text x="656" y="214" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="22" font-weight="700" fill="#1A1A2E">Typical review loop</text>
    <rect x="656" y="256" width="528" height="74" rx="18" fill="#F8FAFC" />
    <text x="688" y="301" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="18" font-weight="700" fill="#D97757">1  Generate a first pass</text>
    <rect x="656" y="346" width="528" height="74" rx="18" fill="#F8FAFC" />
    <text x="688" y="383" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="18" font-weight="700" fill="#4A90D9">
      <tspan x="688" dy="0">2  Inspect specific overflow</tspan>
      <tspan x="688" dy="20">and alignment issues</tspan>
    </text>
    <rect x="656" y="436" width="528" height="74" rx="18" fill="#F8FAFC" />
    <text x="688" y="481" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="18" font-weight="700" fill="#10B981">3  Regenerate or manually fix the affected page</text>
    <rect x="656" y="526" width="528" height="74" rx="18" fill="#F8FAFC" />
    <text x="688" y="571" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="18" font-weight="700" fill="#10B981">4  Finish the final mile inside PowerPoint when needed</text>
  </g>

  <text x="1208" y="684" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="12" fill="#94A3B8">10</text>
</svg>