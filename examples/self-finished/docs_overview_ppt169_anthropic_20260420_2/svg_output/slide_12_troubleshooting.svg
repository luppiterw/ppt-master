<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="softShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="4" result="offsetBlur" />
      <feFlood flood-color="#0F172A" flood-opacity="0.10" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge><feMergeNode in="shadow" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF" />
  <rect x="0" y="0" width="1280" height="6" fill="#D97757" /><text x="60" y="52" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#D97757">TROUBLESHOOTING</text><text x="60" y="86" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="34" font-weight="700" fill="#1A1A2E">
    <tspan x="60" dy="0">Most setup failures are environment issues,</tspan>
    <tspan x="60" dy="36">not product logic issues</tspan>
  </text>
  <text x="60" y="116" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="16" fill="#64748B">The troubleshooting section is mostly about PATH, pip targeting, missing modules, and script permissions.</text>

  <g id="chevrons" filter="url(#softShadow)">
    <polygon points="60,222 254,222 288,266 254,310 60,310" fill="#D97757" />
    <text x="164" y="261" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Check PATH</text>
    <text x="164" y="283" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="11" fill="#FFFFFF">where python</text>

    <polygon points="300,222 494,222 528,266 494,310 300,310 334,266" fill="#4A90D9" />
    <text x="414" y="261" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Match pip to Python</text>
    <text x="414" y="283" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="11" fill="#FFFFFF">python -m pip</text>

    <polygon points="540,222 734,222 768,266 734,310 540,310 574,266" fill="#10B981" />
    <text x="654" y="261" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Test imports</text>
    <text x="654" y="283" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="11" fill="#FFFFFF">pptx + fitz</text>

    <polygon points="780,222 974,222 1008,266 974,310 780,310 814,266" fill="#10B981" />
    <text x="894" y="261" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Run small sample</text>
    <text x="894" y="283" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="11" fill="#FFFFFF">prove the chain</text>

    <polygon points="1020,222 1180,222 1214,266 1180,310 1020,310 1054,266" fill="#EF4444" />
    <text x="1118" y="261" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Escalate edge cases</text>
    <text x="1118" y="283" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="11" fill="#FFFFFF">CairoSVG / Node / Pandoc</text>
  </g>

  <g id="bottomCards">
    <g id="card1" filter="url(#softShadow)">
      <rect x="60" y="378" width="374" height="224" rx="24" fill="#F8FAFC" />
      <text x="92" y="420" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="22" font-weight="700" fill="#1A1A2E">Common failure modes</text>
      <text x="92" y="466" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="15" fill="#64748B">
        <tspan x="92" dy="0">- `python` opens the Microsoft Store</tspan>
        <tspan x="92" dy="24">- `pip` installs to the wrong interpreter</tspan>
        <tspan x="92" dy="24">- PowerShell blocks script execution</tspan>
        <tspan x="92" dy="24">- PyMuPDF import is missing or broken</tspan>
      </text>
    </g>

    <g id="card2" filter="url(#softShadow)">
      <rect x="454" y="378" width="374" height="224" rx="24" fill="#F8FAFC" />
      <text x="486" y="420" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="22" font-weight="700" fill="#1A1A2E">What to try first</text>
      <text x="486" y="466" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="15" fill="#64748B">
        <tspan x="486" dy="0">1  Re-check PATH</tspan>
        <tspan x="486" dy="24">2  Use `python -m pip`</tspan>
        <tspan x="486" dy="24">3  Re-run the core import test</tspan>
        <tspan x="486" dy="24">4  Restart the terminal before retrying</tspan>
      </text>
    </g>

    <g id="card3" filter="url(#softShadow)">
      <rect x="848" y="378" width="372" height="224" rx="24" fill="#F8FAFC" />
      <text x="880" y="420" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="22" font-weight="700" fill="#1A1A2E">Mindset</text>
      <text x="880" y="466" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="15" fill="#64748B">
        <tspan x="880" dy="0">Do not start debugging slide design until the</tspan>
        <tspan x="880" dy="24">runtime, imports, and minimal sample path all</tspan>
        <tspan x="880" dy="24">work cleanly on the machine.</tspan>
      </text>
    </g>
  </g>

  <text x="1208" y="684" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="12" fill="#94A3B8">12</text>
</svg>