<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="84%" cy="16%" r="52%">
      <stop offset="0%" stop-color="#00ACC1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00ACC1" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#0F172A" flood-opacity="0.12" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#bgGlow)"/>
  <circle cx="1100" cy="92" r="170" fill="#1565C0" fill-opacity="0.06"/>
  <circle cx="1040" cy="620" r="210" fill="#7C4DFF" fill-opacity="0.05"/>
  <circle cx="180" cy="132" r="110" fill="#00ACC1" fill-opacity="0.07"/>

  <g id="headerMark">
    <rect x="64" y="56" width="58" height="8" rx="4" fill="#1565C0"/>
    <rect x="64" y="72" width="92" height="8" rx="4" fill="#00ACC1"/>
  </g>

  <g id="titleBlock">
    <text x="84" y="214" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1565C0" letter-spacing="2">DOCUMENTATION SYNTHESIS</text>
    <text x="84" y="302" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="66" font-weight="700" fill="url(#titleGrad)">PPT Master</text>
    <text x="84" y="368" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#1F2937">Product, Architecture, and Setup Overview</text>
    <text x="84" y="414" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="20" fill="#5B6472">A compact deck distilled from the project docs into a single narrative.</text>
  </g>

  <g id="heroCard" filter="url(#softShadow)">
    <rect x="740" y="124" width="462" height="470" rx="28" fill="#FFFFFF"/>
    <rect x="740" y="124" width="462" height="470" rx="28" fill="#1565C0" fill-opacity="0.03"/>
    <use data-icon="chunk/rocket" x="782" y="166" width="40" height="40" fill="#1565C0"/>
    <text x="842" y="194" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#1F2937">What this deck covers</text>

    <g id="coverItem1">
      <rect x="782" y="230" width="378" height="88" rx="18" fill="#EAF0F8"/>
      <text x="812" y="264" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1565C0">01  Product position</text>
      <text x="812" y="292" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="15" fill="#5B6472">Why PPT Master exists and how it differs from other AI slide paths.</text>
    </g>

    <g id="coverItem2">
      <rect x="782" y="338" width="378" height="88" rx="18" fill="#EAF0F8"/>
      <text x="812" y="372" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#00ACC1">02  Technical logic</text>
      <text x="812" y="400" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="15" fill="#5B6472">Why SVG sits at the center of the system and how the pipeline works.</text>
    </g>

    <g id="coverItem3">
      <rect x="782" y="446" width="378" height="88" rx="18" fill="#EAF0F8"/>
      <text x="812" y="480" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#7C4DFF">03  Setup and fit</text>
      <text x="812" y="508" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="15" fill="#5B6472">What users should expect, how to get running on Windows, and who should use it.</text>
    </g>
  </g>

  <g id="pills">
    <rect x="84" y="496" width="188" height="42" rx="21" fill="#1565C0" fill-opacity="0.10"/>
    <text x="178" y="523" text-anchor="middle" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1565C0">Editable output</text>
    <rect x="286" y="496" width="166" height="42" rx="21" fill="#00ACC1" fill-opacity="0.10"/>
    <text x="369" y="523" text-anchor="middle" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#00ACC1">Local workflow</text>
    <rect x="466" y="496" width="164" height="42" rx="21" fill="#7C4DFF" fill-opacity="0.10"/>
    <text x="548" y="523" text-anchor="middle" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#7C4DFF">Open framework</text>
  </g>

  <text x="84" y="660" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="14" fill="#8B95A7">Source set: why-ppt-master.md, technical-design.md, faq.md, windows-installation.md</text>
  <text x="1208" y="684" text-anchor="end" font-family="Arial, Calibri, Microsoft YaHei, sans-serif" font-size="12" fill="#8B95A7">01</text>
</svg>
